# Session environment, single source of truth.
# Read by the systemd user manager (so systemd-run / user units get it) and sourced by ~/.zprofile (so sway and its children get it).
# Keep it in plain KEY=VALUE form, using only $VAR / ${VAR}, so it stays valid both for environment.d(5) and for sh.

# Electron apps (Volanta, ...) use native Wayland instead of Xwayland.
ELECTRON_OZONE_PLATFORM_HINT=auto

# Without this, libXcursor on Xwayland sizes the cursor from the X screen, which spans the headless outputs, giving a ~200px cursor.
XCURSOR_SIZE=24

# User scripts (lgtvcmd, nightlight, ...) reachable from units and from sway exec.
PATH=$HOME/.local/bin:$PATH
